<body>
  <div id="__bundler_placeholder">Loading Scooter – Create a role...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<!-- Brief -->\n        <aside aria-label=\"Role brief\" style=\"flex: 1 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #EAE6DF; border-radius: 16px; padding: 20px\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\">\n            <div style=\"font-family: 'Geist Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #6b6360\">Role brief<\u002Fdiv>\n            <sc-if value=\"{{ briefReady }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: #DDF1E6; color: #145c39\">Ready<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ briefDraft }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: #F2EEE8; color: #4a4540\">{{ briefStatus }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"font-size: 20px; font-weight: 700; margin: 10px 0 2px; letter-spacing: -0.01em\">{{ roleTitle }}<\u002Fdiv>\n          <div style=\"color: #6b6360; font-size: 14px; margin-bottom: 16px\">{{ roleSub }}<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column\">\n            <sc-for list=\"{{ fields }}\" as=\"f\" hint-placeholder-count=\"6\">\n              <div style=\"display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #F2EEE8\">\n                <span style=\"color: #6b6360; font-size: 14px\">{{ f.k }}<\u002Fspan>\n                <sc-if value=\"{{ f.pending }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: #FBE7B8; color: #6b4a0a\">Needed<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ f.filled }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"font-size: 14px; font-weight: 500; text-align: right\">{{ f.v }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Faside>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ JOB · SOURCING ============ -->\n  <sc-if value=\"{{ isAgent }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"flex: 1; width: 100%; max-width: 1240px; margin: 0 auto; padding: 32px 48px; box-sizing: border-box\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 20px\">\n        <div>\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px\">\n            <h1 style=\"margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 700\">Sales Account Executive<\u002Fh1>\n            <span style=\"display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: #DDF1E6; color: #145c39\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: #1a7a4c\"><\u002Fspan>Live<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top: 4px; color: #6b6360; font-size: 14px\">Truein · Baner, Pune · In office · 4 to 6 yrs · {{ ctcLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-left: auto; display: flex; gap: 4px; border-bottom: 1px solid #E0DCD4\">\n          <button sc-camel-on-click=\"{{ goBrief }}\" style=\"min-height: 40px; padding: 8px 14px; border: none; background: none; color: #6b6360; font-size: 14px; font-weight: 500; cursor: pointer\">Brief<\u002Fbutton>\n          <button style=\"min-height: 40px; padding: 8px 14px; border: none; border-bottom: 2px solid #1e1812; background: none; color: #1e1812; font-size: 14px; font-weight: 700; cursor: default\" aria-current=\"page\">Sourcing<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n        <!-- Activity -->\n        <section aria-label=\"Sourcing activity\" style=\"flex: 999 1 600px; min-width: 0; background: #FFFFFF; border: 1px solid #EAE6DF; border-radius: 16px\">\n          <div style=\"padding: 14px 20px; border-bottom: 1px solid #EAE6DF; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px\">\n            <div style=\"display: flex; align-items: center; gap: 8px; font-weight: 700\">\n              <sc-if value=\"{{ playing }}\" hint-placeholder-val=\"{{ false }}\">\n                <span class=\"sc-pulse\" style=\"width: 8px; height: 8px; border-radius: 50%; background: #22a06b\"><\u002Fspan>\n              <\u002Fsc-if>\n              Activity\n              <span style=\"font-family: 'Geist Mono', monospace; font-weight: 400; font-size: 12px; color: #6b6360\">{{ dayLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto\">\n              <span style=\"font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #F2EEE8; color: #1e1812\"><span style=\"font-family: 'Geist Mono', monospace; font-weight: 500\">{{ agentCount }}<\u002Fspan> automated<\u002Fspan>\n              <span style=\"font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #FBE7B8; color: #6b4a0a\"><span style=\"font-family: 'Geist Mono', monospace; font-weight: 500\">{{ humanCount }}<\u002Fspan> team checkpoints<\u002Fspan>\n              <button sc-camel-on-click=\"{{ replay }}\" aria-label=\"Replay activity\" style=\"min-width: 36px; min-height: 36px; border-radius: 8px; border: 1px solid #E0DCD4; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center\">\n                <svg aria-hidden=\"true\" width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4a4540\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 3-6.7\"><\u002Fpath><path d=\"M3 4v5h5\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n              <button sc-camel-on-click=\"{{ skip }}\" aria-label=\"Show all activity\" style=\"min-width: 36px; min-height: 36px; border-radius: 8px; border: 1px solid #E0DCD4; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center\">\n                <svg aria-hidden=\"true\" width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4a4540\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 5 7 7-7 7\"><\u002Fpath><path d=\"m13 5 7 7-7 7\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <ol style=\"list-style: none; margin: 0; padding: 8px 0; min-height: 520px\">\n            <sc-for list=\"{{ events }}\" as=\"e\" hint-placeholder-count=\"6\">\n              <li class=\"sc-in\" style=\"display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; padding: 12px 20px\">\n                <div style=\"font-family: 'Geist Mono', monospace; font-size: 12px; color: #6b6360; padding-top: 3px\">{{ e.time }}<\u002Fdiv>\n                <div>\n                  <sc-if value=\"{{ e.isAgent }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #6b6360; margin-bottom: 2px\">{{ e.lane }}<\u002Fdiv>\n                    <div style=\"font-weight: 500\">{{ e.text }}<\u002Fdiv>\n                    <div style=\"font-size: 14px; color: #6b6360\">{{ e.detail }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ e.isHuman }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"border: 1px solid #F0D58E; background: #FFF8E6; border-radius: 12px; padding: 12px 14px\">\n                      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 4px\">\n                        <span style=\"display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 6px; background: #FBE7B8; color: #6b4a0a\">\n                          <svg aria-hidden=\"true\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6\"><\u002Fpath><\u002Fsvg>\n                          Team checkpoint\n                        <\u002Fspan>\n                        <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #6b4a0a\">{{ e.lane }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-weight: 500\">{{ e.text }}<\u002Fdiv>\n                      <div style=\"font-size: 14px; color: #5b4636\">{{ e.detail }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fli>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ playing }}\" hint-placeholder-val=\"{{ false }}\">\n              <li style=\"display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; padding: 12px 20px\">\n                <span><\u002Fspan>\n                <span class=\"sc-pulse\" style=\"font-size: 14px; color: #6b6360\">Working…<\u002Fspan>\n              <\u002Fli>\n            <\u002Fsc-if>\n          <\u002Fol>\n        <\u002Fsection>\n\n        <!-- Right column -->\n        <div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n          <section aria-label=\"Pipeline\" style=\"background: #FFFFFF; border: 1px solid #EAE6DF; border-radius: 16px; padding: 20px\">\n            <div style=\"font-family: 'Geist Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #6b6360; margin-bottom: 14px\">Pipeline<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 10px\">\n              <sc-for list=\"{{ funnel }}\" as=\"s\" hint-placeholder-count=\"6\">\n                <div>\n                  <div style=\"display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 4px\">\n                    <span style=\"color: #4a4540\">{{ s.label }}<\u002Fspan>\n                    <span style=\"font-family: 'Geist Mono', monospace; font-weight: 500\">{{ s.value }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height: 8px; border-radius: 4px; background: #F2EEE8\">\n                    <div style=\"{{ s.barStyle }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top: 16px; padding-top: 14px; border-top: 1px solid #F2EEE8; font-size: 13px; color: #4a4540; display: flex; gap: 8px\">\n              <svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1a7a4c\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 1px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n              Candidates reach you only after they've opted in to this role and completed screening.\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section aria-label=\"Channels\" style=\"background: #FFFFFF; border: 1px solid #EAE6DF; border-radius: 16px; padding: 20px\">\n            <div style=\"font-family: 'Geist Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #6b6360; margin-bottom: 12px\">Channels<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column\">\n              <sc-for list=\"{{ channels }}\" as=\"ch\" hint-placeholder-count=\"5\">\n                <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid #F2EEE8; font-size: 14px\">\n                  <span>{{ ch.name }}<\u002Fspan>\n                  <sc-if value=\"{{ ch.on }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"font-size: 12px; color: #145c39\">{{ ch.status }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ ch.off }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"font-size: 12px; color: #6b6360\">Queued<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section aria-label=\"Updates sent to you\" style=\"background: #FFFFFF; border: 1px solid #EAE6DF; border-radius: 16px; padding: 20px\">\n            <div style=\"font-family: 'Geist Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #6b6360; margin-bottom: 12px\">Sent to you<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 10px; min-height: 40px\">\n              <sc-for list=\"{{ updates }}\" as=\"u\" hint-placeholder-count=\"2\">\n                <div class=\"sc-in\" style=\"display: flex; gap: 10px; align-items: flex-start\">\n                  <span style=\"flex: none; font-family: 'Geist Mono', monospace; font-size: 11px; padding: 2px 6px; border-radius: 5px; background: #F2EEE8; color: #4a4540; margin-top: 2px\">{{ u.channel }}<\u002Fspan>\n                  <span style=\"font-size: 14px\">{{ u.text }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { screen: 'brief', chat: 0, a1: null, a2: null, a3: null, feed: 0, playing: false, draft: '', fileName: null, described: null };\n  }\n\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  eventList() {\n    return [\n      { time: 'Day 0 · 10:02', lane: 'Posting', human: false, text: 'Published to 6 job boards', detail: 'Candidate-facing JD with the salary band up front' },\n      { time: 'Day 0 · 10:04', lane: 'Posting', human: false, text: 'Shared in 11 sales communities on WhatsApp and Slack', detail: 'Message adapted to each group' },\n      { time: 'Day 0 · 10:06', lane: 'Posting', human: true, text: '2 channels need a person to post: a paid board behind a login and a members-only group', detail: 'Channel owner notified. Posted within the hour' },\n      { time: 'Day 0 · 10:20', lane: 'Sourcing', human: false, text: 'Searched the Scooter talent pool', detail: '312 screened profiles match on B2B SaaS hunting, region, CTC and travel' },\n      { time: 'Day 0 · 10:45', lane: 'Sourcing', human: false, text: 'Ran a passive search on LinkedIn Recruiter', detail: '928 more AEs at HR-tech and workforce SaaS companies selling into GCC and India' },\n      { time: 'Day 0 · 11:30', lane: 'Sourcing', human: false, text: 'Ranked 1,240 profiles and drafted an outreach list of 410', detail: 'Excluded anyone already in another active process' },\n      { time: 'Day 0 · 12:40', lane: 'Sourcing', human: true, text: 'Outreach list reviewed by Ketaki', detail: 'Removed 18 weak fits, approved 392' },\n      { time: 'Day 0 · 14:00', lane: 'Outreach', human: false, text: 'Sent personalised outreach to 392 candidates', detail: 'WhatsApp, email and InMail, each with the role, salary band and travel expectations' },\n      { time: 'Day 1 · 09:00', lane: 'Outreach', human: false, text: 'Followed up with 260 who had not replied', detail: 'Second nudge on a different channel' },\n      { time: 'Day 1 · 18:30', lane: 'Opt-in', human: false, text: '64 opted in and applied. 81 declined and were removed', detail: 'No one moves forward without saying yes to this role' },\n      { time: 'Day 2 · 10:00', lane: 'Screening', human: false, text: 'Screened 122 applicants: 64 from outreach, 58 inbound', detail: 'Hard filters: Pune in office, 4 to 6 yrs B2B SaaS. Scored on region, outbound and CTC fit. 38 passed' },\n      { time: 'Day 2 · 16:00', lane: 'Assessment', human: false, text: 'Invited 38 to the video sales simulation. 26 completed', detail: 'Proctored, scored on discovery, objection handling and clarity' },\n      { time: 'Day 2 · 17:15', lane: 'Review', human: true, text: '3 profiles flagged for manual review', detail: 'Identity not verified, unclear proctoring result, career switcher. Cleared the same day' },\n      { time: 'Day 3 · 09:30', lane: 'Delivery', human: false, text: '12 candidates shared with the hiring manager', detail: 'Report sent on WhatsApp and email' }\n    ];\n  }\n\n  tick() {\n    const total = this.eventList().length;\n    const n = this.state.feed + 1;\n    if (n >= total) { clearInterval(this.timer); this.setState({ feed: total, playing: false }); }\n    else { this.setState({ feed: n }); }\n  }\n\n  startFeed() {\n    clearInterval(this.timer);\n    this.setState({ screen: 'agent', feed: 1, playing: true });\n    this.timer = setInterval(() => this.tick(), 1400);\n  }\n\n  renderVals() {\n    const s = this.state;\n\n    // ---------- create role ----------\n    const q1 = ['HR heads and CHROs', 'Ops and plant heads', 'Founders and CXOs'];\n    const q2 = ['15 to 20 LPA', '18 to 24 LPA', '22 to 28 LPA'];\n    const q3 = ['GCC is a must', 'Strong India hunter who will travel is fine'];\n    const msgs = [{ isBot: true, text: \"Hi! Drop in your JD, or just tell me who you're hiring.\" }];\n    if (s.chat >= 1) {\n      if (s.described) msgs.push({ isUser: true, text: s.described });\n      else msgs.push({ isFile: true, text: s.fileName || 'Sales_Account_Executive_JD.pdf' });\n      msgs.push({ isBot: true, text: \"Got it. From your JD: Sales Account Executive at Truein, Baner (Pune), in office, 4 to 6 years of B2B SaaS, hunting across GCC, India and SEA. Outbound-heavy, full cycle, with client travel. HR-tech experience is a plus.\\n\\nThree things the JD doesn't say, and they change who we look for.\\n\\nWho will they be selling to? The JD says \\\"decision-makers\\\".\" });\n    }\n    if (s.chat >= 2) {\n      msgs.push({ isUser: true, text: s.a1 });\n      msgs.push({ isBot: true, text: 'What fixed CTC range are you working with? The JD says \\\"competitive\\\", and candidates filter on this first.' });\n    }\n    if (s.chat >= 3) {\n      msgs.push({ isUser: true, text: s.a2 });\n      msgs.push({ isBot: true, text: 'The JD asks for hunting experience across GCC, India and SEA. Is GCC selling a must, or is a strong India hunter who is happy to travel to the Gulf fine?' });\n    }\n    if (s.chat >= 4) {\n      msgs.push({ isUser: true, text: s.a3 });\n      msgs.push({ isBot: true, text: \"All set. I've rewritten the JD for candidates and set your matching criteria.\\nOnce you go live, sourcing runs in the background and you'll get updates on WhatsApp and email.\" });\n      msgs.push({ isPlan: true });\n    }\n    const answer = (key, val) => () => {\n      const next = { chat: s.chat + 1 };\n      next[key] = val;\n      this.setState(next);\n    };\n    const submit = () => {\n      const txt = (s.draft || '').trim();\n      if (!txt) return;\n      if (s.chat === 0) { this.setState({ chat: 1, described: txt, draft: '' }); return; }\n      const key = ['a1', 'a2', 'a3'][s.chat - 1];\n      if (!key) return;\n      const next = { chat: s.chat + 1, draft: '' };\n      next[key] = txt;\n      this.setState(next);\n    };\n    const placeholders = [\"Or describe who you're hiring…\", 'Type your answer…', 'e.g. 20 to 26 LPA', 'Type your answer…'];\n    let chips = [];\n    if (s.chat === 1) chips = q1.map((l) => ({ label: l, pick: answer('a1', l) }));\n    if (s.chat === 2) chips = q2.map((l) => ({ label: l, pick: answer('a2', l) }));\n    if (s.chat === 3) chips = q3.map((l) => ({ label: l, pick: answer('a3', l) }));\n\n    const raw = [\n      { k: 'Location', v: 'Baner, Pune · In office', fromJd: true },\n      { k: 'Experience', v: '4 to 6 yrs B2B SaaS', fromJd: true },\n      { k: 'Regions', v: 'GCC, India, SEA', fromJd: true },\n      { k: 'Motion', v: 'Outbound-heavy · Travel', fromJd: true },\n      { k: 'Good to have', v: 'HR-tech, consultative', fromJd: true },\n      { k: 'Sells to', v: s.a1 },\n      { k: 'Fixed CTC', v: s.a2 },\n      { k: 'GCC experience', v: s.a3 }\n    ];\n    const fields = raw.map((f) => {\n      if (s.chat < 1) return { k: f.k, v: '–', pending: false, filled: true };\n      const has = !!f.v;\n      return { k: f.k, v: f.v || '', pending: !has, filled: has };\n    });\n\n    // ---------- sourcing ----------\n    const all = this.eventList();\n    const visible = all.slice(0, s.feed).map((e) => ({ time: e.time, lane: e.lane, text: e.text, detail: e.detail, isAgent: !e.human, isHuman: e.human }));\n    const agentCount = visible.filter((e) => e.isAgent).length;\n    const humanCount = visible.filter((e) => e.isHuman).length;\n    const dayLabel = visible.length ? visible[visible.length - 1].time.split(' · ')[0] : 'Day 0';\n\n    const stages = [\n      { label: 'Profiles found', value: '1,240', at: 6, w: 100 },\n      { label: 'Contacted', value: '392', at: 8, w: 72 },\n      { label: 'Opted in and applied', value: '122', at: 11, w: 50 },\n      { label: 'Passed screening', value: '38', at: 11, w: 34 },\n      { label: 'Completed video', value: '26', at: 12, w: 24 },\n      { label: 'Ready for you', value: '12', at: 14, w: 14 }\n    ];\n    const funnel = stages.map((st, i) => {\n      const on = s.feed >= st.at;\n      const color = i === stages.length - 1 ? '#E8836A' : '#1e1812';\n      return {\n        label: st.label,\n        value: on ? st.value : '–',\n        barStyle: 'height: 8px; border-radius: 4px; transition: width .6s ease; background: ' + color + '; width: ' + (on ? st.w : 0) + '%'\n      };\n    });\n\n    const chDefs = [\n      { name: 'Job boards', at: 1, status: '6 live' },\n      { name: 'Sales communities', at: 2, status: '11 live' },\n      { name: 'Gated channels', at: 3, status: 'Posted by team' },\n      { name: 'Scooter talent pool', at: 4, status: '312 matches' },\n      { name: 'LinkedIn Recruiter', at: 5, status: '928 profiles' }\n    ];\n    const channels = chDefs.map((c) => ({ name: c.name, status: c.status, on: s.feed >= c.at, off: s.feed < c.at }));\n\n    const upd = [\n      { at: 3, channel: 'WA', text: 'Your role is live on 19 channels.' },\n      { at: 10, channel: 'Email', text: '64 candidates have opted in so far.' },\n      { at: 14, channel: 'WA', text: '12 candidates are ready to review.' }\n    ];\n    const updates = upd.filter((u) => s.feed >= u.at);\n\n    return {\n      isBrief: s.screen === 'brief', isAgent: s.screen === 'agent',\n      goBrief: () => { clearInterval(this.timer); this.setState({ screen: 'brief', playing: false }); },\n      msgs, chips,\n      showUpload: s.chat === 0, showChips: s.chat >= 1 && s.chat <= 3, showGoLive: s.chat >= 4, showInput: s.chat <= 3,\n      draft: s.draft || '',\n      placeholder: placeholders[s.chat] || '',\n      onDraft: (e) => this.setState({ draft: e.target.value }),\n      onKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } },\n      send: submit,\n      onFile: (e) => { const f = e.target.files && e.target.files[0]; if (f) this.setState({ chat: 1, fileName: f.name, described: null }); },\n      goLive: () => this.startFeed(),\n      resetChat: () => this.setState({ chat: 1, a1: null, a2: null, a3: null }),\n      briefReady: s.chat >= 4, briefDraft: s.chat < 4,\n      briefStatus: s.chat === 0 ? 'Waiting for JD' : (4 - s.chat) + ' to go',\n      roleTitle: s.chat >= 1 ? 'Sales Account Executive' : 'New role',\n      roleSub: s.chat >= 1 ? 'Truein · Workforce management SaaS · IC, quota-carrying' : 'Details fill in as we go',\n      fields,\n      ctcLabel: s.a2 || 'CTC as agreed',\n      events: visible, agentCount, humanCount, dayLabel, playing: s.playing,\n      funnel, channels, updates,\n      replay: () => this.startFeed(),\n      skip: () => { clearInterval(this.timer); this.setState({ feed: all.length, playing: false }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
